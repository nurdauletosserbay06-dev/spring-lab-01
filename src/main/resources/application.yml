
spring:
  application:
    name: spring-lab

  datasource:
    url: jdbc:postgresql://localhost:5432/springlab
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  owner: Osserbay Nurdaulet
  group: IT1-2402 IS
  security:
    jwt-secret: ${JWT_SECRET:my-super-secret-key-12345}
    token-validity: 3600s
  mail:
    from: no-reply@iitu.kz
    retry-count: 3
    timeout: 5s
    enabled: true

logging:
  level:
    kz.iitu: INFO
    org.springframework.security: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
