
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Catalogue</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<h1 th:text="${title}">Catalogue</h1>

<p th:if="${message}"
   class="flash"
   th:text="${message}"></p>

<!-- Filter books -->
<form th:action="@{/books}" method="get">
    <label for="filter">Filter by author:</label>
    <input id="filter"
           name="author"
           placeholder="For example: Bloch">

    <button type="submit">Filter</button>
    <a th:href="@{/books}">Show all</a>
</form>

<!-- Book catalogue -->
<table>
    <thead>
    <tr>
        <th>#</th>
        <th>Title</th>
        <th>Author</th>
        <th>Year</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.id}">1</td>
        <td th:text="${book.title}">Title</td>
        <td th:text="${book.author}">Author</td>
        <td th:text="${book.year}">2020</td>
    </tr>
    </tbody>
</table>

<!-- Add a book -->
<h2>Add a book</h2>

<form th:action="@{/books}" method="post">

    <!-- CSRF protection -->
    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">

    <input name="title"
           placeholder="Title"
           required>

    <input name="author"
           placeholder="Author"
           required>

    <input name="year"
           type="number"
           placeholder="Year"
           required>

    <button type="submit">Add book</button>
</form>
<form th:action="@{/logout}" method="post">
    <button type="submit">Logout</button>
</form>

</body>
</html>
