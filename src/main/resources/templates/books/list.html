<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Catalogue</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<h1 th:text="${title}">Catalogue</h1>

<p th:if="${message}" class="flash" th:text="${message}"></p>

<form action="/books" method="get">
    <label for="filter">Filter by author:</label>
    <input id="filter" name="author" placeholder="For example: Bloch">
    <button type="submit">Filter</button>
    <a href="/books">Show all</a>
</form>

<table>
    <thead>
    <tr>
        <th>#</th>
        <th>Title</th>
        <th>Author</th>
        <th>Year</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.id}">1</td>
        <td th:text="${book.title}">Title</td>
        <td th:text="${book.author}">Author</td>
        <td th:text="${book.year}">2020</td>
    </tr>
    </tbody>
</table>

<h2>Add a book</h2>

<form action="/books" method="post">
    <input name="title" placeholder="Title" required>
    <input name="author" placeholder="Author" required>
    <input name="year" type="number" placeholder="Year" required>
    <button type="submit">Add book</button>
</form>
</body>
</html>
